<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Mascote em 3D</title>
    <!-- O visor 3D dos mascotes (desde 2026-11-25, pedido do dono): o app abre esta página quando a pessoa toca no mascote
         (no celular numa WebView, no navegador num quadro). visor3d.html?m=<chave>&c=<cor da raridade, sem #>. O modelo
         vem de modelos/<chave>.glb, exportado do Blender por brand/mascotes-voxel/exportar.py. -->
    <link rel="stylesheet" href="visor3d.css" />
    <script type="module" src="visor3d.js"></script>
  </head>
  <body>
    <div id="brilho"></div>
    <canvas id="tela" aria-label="O mascote em 3D. Arraste para girar e use dois dedos para aproximar."></canvas>
    <div id="aviso" role="status">Carregando o mascote...</div>
    <div id="dica">Arraste para girar · dois dedos para aproximar</div>
  </body>
</html>
