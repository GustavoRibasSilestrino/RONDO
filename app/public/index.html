      @keyframes respira { 0%, 100% { opacity: 0.75; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.03); } }
      @keyframes gira { 0%, 100% { transform: scale(0.985); } 50% { transform: scale(1.015); } }
