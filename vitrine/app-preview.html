<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yesteryou · app dentro do site</title>
<link rel="stylesheet" href="css/base.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: #050507; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .tel { width: 390px; max-width: 100%; height: min(820px, calc(100vh - 110px)); border-radius: 46px; padding: 10px; background: #0b0814; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 40px 90px rgba(0,0,0,.6); }
  .tel iframe { width: 100%; height: 100%; border: 0; border-radius: 38px; background: #050507; display: block; }
  p { color: #b9b0d8; font-weight: 300; font-size: 14px; margin: 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tel"><iframe src="http://localhost:5190" title="App Yesteryou"></iframe></div>
  <p>Entre com qualquer e-mail e senha (demonstração). A barra de vidro fica embaixo.</p>
</div>
</body>
</html>
